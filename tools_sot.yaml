organ: WEALTH
version: 2026.08.03
sot_source: wealth_mcp/tools/canonical.py
live_port: 18082
tools:
  - name: capital_primitive
    access: public
    description: >
      Deductive capital math primitives. Pure computation — no inference,
      no governance verdict. Every mode is golden-tested against hand-checked
      cases. Standard cash flow convention: CF[0] at t=0 (initial investment,
      typically negative), CF[1:] at t=1, t=2, ...

      Modes: npv | irr | emv | evoi | mc | kelly | markowitz |
      robust | chance_constrained | two_stage

      Use when: the user asks about NPV, IRR, expected monetary value,
      Kelly criterion sizing, Markowitz portfolio optimization, Monte Carlo
      simulation, or any deductive capital math computation.
    tags:
      domain: capital
      kind: deductive
      canonical: v1

  - name: capital_health
    access: public
    description: >
      Financial health metrics. Deductive computation from structured inputs.
      No inference, no governance verdict.

      Modes: conservation | flow | runway | survival | fiscal_breakeven |
      confluence | asymmetry

      Use when: the user asks about net worth, cash flow, financial runway,
      burn rate, fiscal breakeven oil price, or false-confluence detection
      in financial indicators.
    tags:
      domain: capital
      kind: deductive
      canonical: v1

  - name: capital_diagnose
    access: public
    description: >
      Abductive institutional diagnostics — inference from partial evidence.
      Surface: mode, domain_scope, payload (dict). Mode-specific fields go in
      payload. REQUIRED: domain_scope declares calibration domain. Unknown
      fields are REJECTED (not silently dropped to 0.0).

      Modes: stress_index | governance_capacity | cascade_model |
      exploitation_detect | collapse_signature | beautiful_mouse |
      capture_scan | power_audit | bid_surface | optimize_mwc |
      cadence_monitor | crisis_reflex

      Use when: institutional stress, governance, collapse, power, MWC,
      cadence monitoring, or crisis reflex analysis.
    tags:
      domain: institutional
      kind: abductive
      canonical: v1

  - name: capital_market
    access: public
    description: >
      Market data and commodity intelligence. Observational with
      derived and interpreted fields.

      Top-level: mode, base, targets, commodity, operation, country.
      Stock fields in stock_payload dict.

      Modes: fx | commodity | indicator | stock | gold | oil | gas

      For gold/oil/gas: mode='gold'|'oil'|'gas' with
      operation='snapshot'|'ticker'|'signal'|'macro'|'history'|'levels'.
      Legacy: use commodity param for operation (deprecated).

      Epistemic classes per output field:
        OBSERVED — price, volume, timestamp
        DERIVED — EMA, RSI, support/resistance
        INTERPRETED — LONG/SHORT/NEUTRAL signal

      Use when: FX, commodities, macro indicators, stock analysis, or
      gold/oil/gas market intelligence.
    tags:
      domain: market
      kind: observational
      canonical: v1

  - name: capital_ledger
    access: public
    description: >
      VAULT999 immutable ledger access. Query is read-only (no ack required).
      Write requires explicit human acknowledgment (ack_irreversible=true).
      WEALTH computes. arifOS judges. Arif decides. WEALTH does not self-seal.

      Modes: query | write

      Use when: the user wants to query past capital transactions from
      VAULT999, or write a new transaction (requires human ack for writes).
    tags:
      domain: vault
      kind: mutating
      canonical: v1
      action_class: IRREVERSIBLE
      risk_class: C2
      query_override: READONLY

  - name: capital_registry
    access: public
    description: >
      WEALTH meta/introspection. Registry status, tool schema, domain index,
      health check. Observational only.

      Modes: status | schema | domains | health

      Use when: the user wants to inspect the WEALTH tool registry,
      check available domains, view tool schemas, or run a health check.
    tags:
      domain: meta
      kind: observational
      canonical: v1

  - name: capital_entropy
    access: public
    description: >
      Capital and institutional entropy analysis. Modes:
      power_consequence_map, metric_purpose_audit, responsibility_ledger,
      trust_capital_decay, coercive_order_cost, entropy_externality.
      Measures information loss, consequence displacement, metric drift.
      Computes, never allocates.
    tags:
      domain: institutional
      kind: abductive
      canonical: v1
      entropy: mesh

  - name: wealth_judge_handoff
    access: public
    description: >
      Build or validate a structured handoff envelope for arifOS governance
      review. Preparation is advisory; submission remains authority-gated.

      Modes: prepare | submit
    tags:
      domain: governance
      kind: handoff
      canonical: v1

  - name: capital_polix
    access: public
    description: >
      Power topology intelligence — incentive mapping, capture detection,
      rent extraction analysis, rule asymmetry.

      Modes: topology | capture | rents | asymmetry

      SEED CASES (archival/calibration only, P0 2026-09-21):
      malaysia_fiscal | petronas_glc. Static seed-mode default REMOVED per
      F13 'Drop' directive 2026-09-21 — caller MUST supply seed_case (or
      use material_fields for live substrate). Calling without seed_case
      returns UNMEASURED + REQUIRED_MATERIAL_FIELDS.

      Schema (6 args, session-bound; OBSERVE_ONLY authority by default):
        mode            : str  default "topology"  enum [topology, capture, rents, asymmetry]
        seed_case       : str|None  default None  BEHAVIOR-REQUIRED — None returns UNMEASURED
        session_id      : str|None  optional
        trace_id        : str|None  optional
        actor_id        : str|None  optional (subject; may be anonymous through
                                      authenticated machine channel per P0-3)
        caller_service  : str|None  optional, default via bridge (arifos | aforge |
                                      arifos_kernel). Authority ceiling OBSERVE_ONLY
                                      when subject is anonymous.

      Risk tier: READONLY (interpretive; OBSERVE-class). SIDE EFFECT:
      writes a vault receipt carrying caller_service, identity_model, and
      authority_ceiling so audit chain proves the delegation model.

      Behavioural contract (locked by FEDERATION-E2E-CANARY, P0-2 / 2026-09-21):
        capital_polix()              → UNMEASURED + REQUIRED_MATERIAL_FIELDS
        capital_polix(seed_case=...)  → mode-specific result (5 args, session-bound)
    input_schema:
      mode:            {type: string,  default: "topology", required: false,
                        enum: [topology, capture, rents, asymmetry]}
      seed_case:       {type: [string, "null"], default: null, required: false,
                        behavior: "BEHAVIOR-REQUIRED — None returns UNMEASURED + REQUIRED_MATERIAL_FIELDS"}
      session_id:      {type: [string, "null"], required: false}
      trace_id:        {type: [string, "null"], required: false}
      actor_id:        {type: [string, "null"], required: false}
      caller_service:  {type: [string, "null"], required: false,
                        enum_pattern: ["^arifos(_kernel)?$", "^aforge$"]}
    tags:
      domain: political_economy
      kind: interpretive
      canonical: v1
      action_class: OBSERVE
      risk_tier: READONLY
      governance_session_required: false    # OBSERVE-only via dual-identity bridge

  - name: capital_civx
    access: public
    description: >
      Civilizational scenario intelligence — long-horizon resilience,
      sovereignty, intergenerational burden.

      Modes: scenario | resilience | risks | assumptions

      SEED CASES: malaysia_fiscal_2027_2040 (default).
      Status: SAFE_TO_STUDY — never decision authority until calibrated.

      Schema (5 args, session-bound):
        mode       : str   default "scenario"
        seed_case  : str   default "malaysia_fiscal_2027_2040"
        session_id : str|None
        trace_id   : str|None
        actor_id   : str|None

      Risk tier: READONLY (scenario). SIDE EFFECT: writes a vault receipt.
    tags:
      domain: civilizational
      kind: scenario
      canonical: v1
      action_class: OBSERVE
      risk_tier: READONLY

  # ═══ NEW MODES — TradeMaster Distillation (2026-08-18) ═══
  # All new modes are additive to existing canonical tools.
  # No new tools created. DITEMPA BUKAN DIBERI.

  - name: capital_diagnose.mode=regime_map
    access: public
    description: >
      Distribution-aware market regime classification. Labels each bar as
      BULL/BEAR/SIDEWAYS/VOLATILE/CRISIS using rolling statistics (mean, std,
      skew, kurtosis), ATR volatility ratio, and directional movement index.

      Computes regime transition probabilities and detects distribution shifts.

      Eureka source: TradeMaster (NTU) market dynamics labeling + AlphaMix+.
      Engine: wealth_core/regime_map.py

      Input: payload.closes, payload.highs, payload.lows (float arrays)
      Output: current_regime, regime_distribution, transitions, shift_detection
    tags:
      domain: market
      kind: derived
      canonical: v1
      eureka: trademaster-distillation

  - name: capital_backtest.mode=compass
    access: public
    description: >
      PRUDEX-Compass: 6-axis strategy evaluation framework.
      Axes: Profitability, Risk Control, Diversity, Reliability,
      Explainability, Universality. 16 measures total.

      Eureka source: TradeMaster (NTU) PRUDEX-Compass.
      Engine: wealth_core/compass.py

      Input: payload.equity_curve, payload.trade_returns, optional
      payload.benchmark_returns, payload.regime_labels
      Output: axes[], overall_score, classification, regime_performance
    tags:
      domain: evaluation
      kind: derived
      canonical: v1
      eureka: prudex-compass

  - name: capital_backtest.mode=stress_test
    access: public
    description: >
      Synthetic adversarial reality generation for strategy stress testing.
      8 default scenarios: vol scaling (+50%/+100%/+200%), crisis injection,
      flash crash, fat tail amplification, combined stress.

      Eureka source: TradeMaster (NTU) Market-GAN concepts.
      Engine: wealth_core/stress_test.py

      Input: payload.equity_curve, payload.trade_returns
      Output: baseline metrics, per-scenario results, robustness_score (0-100)
    tags:
      domain: evaluation
      kind: derived
      canonical: v1
      eureka: market-gan-stress

  - name: capital_backtest.mode=ensemble
    access: public
    description: >
      Regime-aware strategy composition (AlphaMix+ distillation).
      Runs 6 strategy variants (trend_fast, trend_standard, trend_slow,
      mean_revert, breakout, conservative) across detected regimes.
      Optimal regime-to-strategy mapping via greedy Sharpe assignment.

      Eureka source: TradeMaster (NTU) AlphaMix+ (KDD 2023).
      Engine: wealth_core/ensemble.py

      Input: symbol, interval, lookback (uses live yfinance data)
      Output: regime_strategy_map, ensemble_metrics, improvement vs baseline
    tags:
      domain: evaluation
      kind: derived
      canonical: v1
      eureka: alphamix-ensemble

  - name: capital_health.mode=asymmetric_risk
    access: public
    description: >
      Drawdown-sensitive position sizing (DeepScalper distillation).
      Asymmetric Kelly Criterion with loss aversion coefficient,
      Omega Ratio, Pain-to-Gain ratio, drawdown state classification.

      Eureka source: TradeMaster (NTU) DeepScalper (CIKM 2022).
      Engine: wealth_core/asymmetric_risk.py

      Input: upside_scenarios (trade_returns), downside_scenarios (equity_curve)
      Output: standard_kelly, asymmetric_kelly, omega_ratio, drawdown_state,
      position_scaling, recommended_risk_pct
    tags:
      domain: risk
      kind: derived
      canonical: v1
      eureka: deepscalper-asymmetric

  - name: capital_indicator.indicator=alpha158
    access: public
    description: >
      Systematic feature generation (Alpha158 distillation).
      Generates 39+ candidate features from OHLCV data across 7 categories:
      price ratios, returns, volatility, momentum, mean reversion,
      volume-price, microstructure proxies. Top features ranked by variance.

      Eureka source: TradeMaster (NTU) Alpha158 feature set.
      Engine: wealth_core/alpha158.py

      Input: symbol, lookback (uses live yfinance data)
      Output: feature_count, categories, top_features, bars_processed
    tags:
      domain: market
      kind: derived
      canonical: v1
      eureka: alpha158-features

  - name: capital_primitive.mode=reward_design
    access: public
    description: >
      Multi-task reward function design (TradeMaster distillation).
      Designs optimal reward functions for different trading tasks:
      portfolio (Sharpe/Sortino/Calmar), algo (risk-adjusted PnL),
      execution (implementation shortfall), HFT (PnL per trade).

      Eureka source: TradeMaster (NTU) task-specific reward design.
      Engine: wealth_core/reward_design.py

      Input: returns (optional for calibration)
      Output: recommended_reward, all_rewards, task_type, justification
    tags:
      domain: risk
      kind: derived
      canonical: v1
      eureka: trade-master-reward-design

# ═══ IEQ EXTENSION SURFACE (NOT canonical, NOT counted in 15) ═══
# Declared 2026-09-21 per F13 directive:
#   "CanonicalTool ≠ Convenience/ExtensionSurface. Declare the difference."
# These two tools are exposed via the WEALTH external connector (mcp.tools.list)
# but are NOT in the canonical 15-tool SOT. They are institutional-equity
# extensions serving the Six-Graph Federation Model (WEALTH = consequence
# middleware, inequality/role-scarcity as consequence-class concerns, not
# capital-arithmetic). A-FORGE audits (A-FORGE/dist/src/infrastructure/bridges/
# wealthBridge.ts) see 15 — this list declares the +2 explicitly so the gap
# is not ambiguity but a stated surface class.
extension_surface:
  - name: wealth_inequality_kernel
    access: public
    surface_class: ieq_extension
    canonical: false
    description: >
      Distribution / fairness / concentration kernel (W3 — consequence class).
      Measures Gini and concentration gradients across civilization / firm /
      household domains. Implemented in wealth_core/governance/ as a layered
      inequality/equity diagnostic. NOT in the 15-tool canonical SOT because
      it serves the Six-Graph consequence domain, not the capital arithmetic
      domain. Surface class is IEQ extension by intent.
    source: wealth_core/governance/inequality_kernel.py
    tags:
      domain: consequence
      kind: diagnostic
      canonical: false
      surface_class: ieq_extension

  - name: wealth_role_scarcity_risk
    access: public
    surface_class: ieq_extension
    canonical: false
    description: >
      Role-scarcity & status-bottleneck risk model (W3 — consequence class).
      Surfaces youth unemployment, housing unaffordability, delayed family
      formation, weak social mobility, low trust, civic disengagement,
      status bottleneck, future-orientation collapse. Implemented in
      wealth_core/governance/role_scarcity.py. NOT in the 15-tool canonical
      SOT for the same reason as wealth_inequality_kernel — consequence
      middleware, not capital arithmetic.
    source: wealth_core/governance/role_scarcity.py
    tags:
      domain: consequence
      kind: diagnostic
      canonical: false
      surface_class: ieq_extension

# ═══ SURFACE TAXONOMY DECLARATION ═══
surface_taxonomy:
  declared_by: F13
  ratified_chat: 2026-09-21
  # P1 2026-09-21 — WEALTH-IDENTITY-PIVOT-P1 — pivot to Ω architecture.
  # The 17-tool raw count is replaced with semantic classes:
  #   13 canonical primitives (Ω00 + Ω01-Ω12)
  #   2 societal extensions (inequality, role scarcity)
  #   2 infrastructure tools (health, registry)
  #   N compatibility aliases (capital_* legacy names)
  canonical_count: 13
  extension_count: 2
  infrastructure_count: 2
  compatibility_alias_count: 14   # capital_* legacy names — excluded from canonical
  total_external_visible: 17      # canonical + extensions + infrastructure (aliases excluded)
  source_of_truth: tools_sot.yaml (this file)
  audit_consumer: A-FORGE surface audit (registry==affordance verified CLEAN)

  p0_2026_09_21_addendum: |
    P0 2026-09-21 (FEDERATION-CONVERGENCE-P0): capital_polix and capital_civx
    promoted from mode-extension to canonical. canonical_count: 15 → 17.

  p1_2026_09_21_pivot: |
    P1 2026-09-21 (WEALTH-IDENTITY-PIVOT-P1): the raw 17-tool count is
    reorganized into the 12-invariant Ω architecture. The 12 Ω-invariants
    represent the fundamental dimensions of capital reality (mass, flow,
    gradient, entropy, energy, time, inertia, field, signal, game,
    boundary, hysteresis) plus Ω00 synthesis. capital_* names become
    compatibility aliases pointing to canonical Ω tools. canonical_count
    is reset from 17 to 13 because each Ω-invariant collapses multiple
    capital_* aliases into one canonical primitive.

  extension_intent: >
    IEQ extensions (inequality, role scarcity) live in wealth_core/governance/
    and serve the consequence-class domain per the Six-Graph Federation Model.
    They are intentionally NOT in the canonical Ω-invariant SOT.

  infrastructure_intent: >
    capital_registry + capital_health are meta/diagnostic tools, NOT
    Ω-invariants. They support the Ω surface (introspection, observability)
    but are not themselves primitive capital computations.

  compatibility_alias_intent: >
    capital_* names are legacy FastMCP tool names retained for backward
    compatibility. They resolve to canonical Ω tools via the alias
    dispatcher (wealth_mcp/server.py:_INTERNAL_LEGACY_ALIASES).
    New clients SHOULD use the canonical Ω names. The aliases remain
    in PUBLIC_TOOL_NAMES until the v3 cutover (F13 schedule).

  why_omega_architecture: >
    Capital reality is best described as 12 invariants + synthesis. NPV,
    RSI, Monte Carlo, backtest, ledger — these are IMPLEMENTATIONS
    underneath those invariants, not the identity. The Ω model makes
    WEALTH's identity: Capital Consequence Intelligence (Ω-invariant
    primitives) — not "AI financial decision engine" (capability list).

  law_cited: "WEALTH = Capital Consequence Intelligence, not decision engine. (F13 2026-09-21)"

# ═══ Ω-INVARIANT REGISTRY ═══
# The 12 fundamental dimensions of capital reality. Each Ω-invariant
# is a primitive that takes world state → capital consequence evidence.
# These names are CANONICAL. capital_* names are aliases.
omega_invariants:
  omega_00_synthesis:
    number: "Ω00"
    invariant: "Cross-dimensional synthesis"
    canonical_name: wealth_synthesize   # pending rename
    alias: capital_diagnose(mode=synthesize)  # current alias
    status: planned
    description: >
      Synthesizes all 12 Ω-invariants into a domain assessment.
      Returns domain_assessment (FAVORABLE|CAUTION|INSUFFICIENT_EVIDENCE|
      CONSTRAINT_VIOLATION), NEVER a constitutional verdict (no SEAL/HOLD/
      SABAR/VOID — those are arifOS's, not WEALTH's).
    question: "If capital moves this way, what follows — and how sure are we?"

  omega_01_conservation:
    number: "Ω01"
    invariant: "Mass"
    question: "What exists?"
    canonical_name: wealth_conservation_capital
    alias: capital_primitive(mode=conservation), capital_ledger(read)
    status: declared
    internal_implementation: wealth_core/institutional/

  omega_02_flow:
    number: "Ω02"
    invariant: "Flow"
    question: "Where is money moving?"
    canonical_name: wealth_flow_liquidity
    alias: capital_health(mode=flow), capital_health(mode=runway)
    status: declared
    internal_implementation: wealth_core/institutional/

  omega_03_gradient:
    number: "Ω03"
    invariant: "Gradient"
    question: "What differential drives movement?"
    canonical_name: wealth_gradient_price
    alias: capital_market(mode=gradient)
    status: declared
    internal_implementation: wealth_core/commodity_engines.py

  omega_04_entropy:
    number: "Ω04"
    invariant: "Entropy"
    question: "How uncertain / disordered is it?"
    canonical_name: wealth_entropy_risk
    alias: capital_entropy, capital_diagnose(mode=stress_index)
    status: declared
    internal_implementation: wealth_core/risk/

  omega_05_energy:
    number: "Ω05"
    invariant: "Energy"
    question: "What output does capital produce?"
    canonical_name: wealth_energy_productivity
    alias: capital_primitive(mode=energy_productivity)
    status: declared
    internal_implementation: wealth_core/institutional/

  omega_06_time:
    number: "Ω06"
    invariant: "Time"
    question: "What is future value worth now?"
    canonical_name: wealth_time_discount
    alias: capital_primitive(mode=npv,irr,payback), capital_health(mode=time_discount)
    status: declared
    internal_implementation: wealth_core/institutional/

  omega_07_inertia:
    number: "Ω07"
    invariant: "Inertia"
    question: "What makes the system hard to change?"
    canonical_name: wealth_inertia_leverage
    alias: capital_diagnose(mode=cascade_model), capital_health(mode=asymmetric_risk)
    status: declared
    internal_implementation: wealth_core/risk/

  omega_08_field:
    number: "Ω08"
    invariant: "Field"
    question: "What macro regime surrounds it?"
    canonical_name: wealth_field_macro
    alias: capital_market(mode=fx,oil,gas,gold,indicator)
    status: declared
    internal_implementation: wealth_core/macro/

  omega_09_signal:
    number: "Ω09"
    invariant: "Signal"
    question: "What information deserves belief?"
    canonical_name: wealth_signal_information
    alias: capital_indicator, capital_diagnose(mode=exploitation_detect)
    status: declared
    internal_implementation: wealth_core/evidence/

  omega_10_game:
    number: "Ω10"
    invariant: "Game"
    question: "What incentives shape behaviour?"
    canonical_name: wealth_game_coordination
    alias: capital_diagnose(mode=power_audit), capital_polix(topology)
    status: declared
    internal_implementation: wealth_core/game/

  omega_11_boundary:
    number: "Ω11"
    invariant: "Boundary"
    question: "What constraints cannot be crossed?"
    canonical_name: wealth_boundary_governance
    alias: capital_diagnose(mode=governance_capacity), capital_diagnose(mode=optimize_mwc)
    status: declared
    internal_implementation: wealth_core/governance/

  omega_12_hysteresis:
    number: "Ω12"
    invariant: "Hysteresis"
    question: "How does history constrain the future?"
    canonical_name: wealth_hysteresis_ledger
    alias: capital_ledger(read), capital_diagnose(mode=collapse_signature)
    status: declared
    internal_implementation: wealth_core/institutional/

  # P1-5: freshness/provenance mandatory on every market/macro output.
  # All Ω08 (Field) outputs MUST carry source + timestamp + cache_age +
  # staleness metadata. LatestAvailable ≠ RealTime.
  omega_field_provenance:
    applies_to: [omega_08_field, omega_09_signal]
    required_metadata: [source, timestamp, cache_age_seconds, staleness_class]
    staleness_classes: [LIVE, RECENT, STALE, ARCHIVAL]
    doctrine: "Freshness ≠ Truth. LatestAvailable ≠ RealTime."
