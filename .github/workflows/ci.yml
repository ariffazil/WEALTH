name: WEALTH CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-gate:
    name: F11 — Secrets Gate
    uses: ariffazil/arifos/.github/workflows/_shared-secrets-gate.yml@main
    secrets:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Fallback: runs if shared workflow is unavailable (e.g. private repo rate-limit)
  secrets-gate-fallback:
    name: F11 — Secrets Gate (local fallback)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: always() && (needs.secrets-gate.result == 'skipped' || needs.secrets-gate.result == 'failure')
    needs: secrets-gate
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Local secrets scan
        run: |
          FAILED=0
          if git diff --name-only HEAD~1 HEAD 2>/dev/null | xargs -r grep -lnE "sk-[a-zA-Z0-9]{20,}" 2>/dev/null; then
            echo "🚨 Key pattern detected"; FAILED=1
          fi
          if git diff --name-only HEAD~1 HEAD 2>/dev/null | xargs -r grep -lnE "hf_[A-Za-z0-9]{20,}" 2>/dev/null; then
            echo "🚨 HF token detected"; FAILED=1
          fi
          if [ $FAILED -eq 1 ]; then exit 1; fi
          echo "Local scan: CLEAN"

  test:
    name: WEALTH CI
    runs-on: ubuntu-latest
    needs: secrets-gate
    if: always() && !failure() && !cancelled()
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]" --quiet

      - name: Run tests
        run: python -m pytest tests/ -q --tb=short

      - name: Import smoke test
        run: python -c "from internal.monolith import WealthKernel; print('✓ WealthKernel importable')"
