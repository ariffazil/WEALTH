name: "🧠 Agentic CI — WEALTH"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: agentic-ci-wealth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  federation-check:
    if: github.actor != 'dependabot[bot]' && github.actor != 'app/dependabot'
    name: 🗺️ Federation Check
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - name: Validate FEDERATION.md
        run: |
          test -f FEDERATION.md || (echo "❌ Missing FEDERATION.md" && exit 1)
          grep -q "role: CAPITAL" FEDERATION.md || (echo "❌ Missing role: CAPITAL" && exit 1)
          grep -q "layer: L5" FEDERATION.md || (echo "❌ Missing layer: L5" && exit 1)
          grep -q "mcp:" FEDERATION.md || (echo "❌ Missing mcp:" && exit 1)
          echo "✅ WEALTH FEDERATION.md valid — L5 CAPITAL"

  protocol-alignment:
    if: github.actor != 'dependabot[bot]' && github.actor != 'app/dependabot'
    name: 📋 Protocol Alignment
    runs-on: ubuntu-latest
    needs: [federation-check]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - name: Protocol alignment gate
        run: |
          if [ -f scripts/check_protocol_alignment.sh ]; then
            bash scripts/check_protocol_alignment.sh
          elif [ -f AAA/scripts/check_protocol_alignment.sh ]; then
            bash AAA/scripts/check_protocol_alignment.sh
          else
            echo "ℹ️ Protocol alignment script not found — running basic checks"
            grep -q "role: CAPITAL" FEDERATION.md || (echo "❌ Missing role" && exit 1)
            grep -q "layer: L5" FEDERATION.md || (echo "❌ Missing layer" && exit 1)
            echo "✅ Basic protocol alignment passed"
          fi

  standard:
    if: github.actor != 'dependabot[bot]' && github.actor != 'app/dependabot'
    name: "Lane 1 — Standard CI"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (Ruff)
        run: ruff check . --output-format=github || echo "⚠️ Lint warnings 
          (non-blocking)"
      - name: Type check (MyPy)
        run: mypy src/ --ignore-missing-imports || echo "⚠️ Type warnings 
          (non-blocking)"
      - name: Test (Pytest)
        run: |
          set -o pipefail
          # Remove broken Z2 symlinks that break pytest collection in CI
          for f in CLAUDE.md AGENTS.md CONTEXT.md RUNBOOK.md FEDERATION_CONTRACT.md LANDING.md SOUL.md; do
            [ -L "$f" ] && [ ! -e "$f" ] && rm -f "$f"
          done
          PYTHONPATH=src pytest tests/ -q --tb=short || echo "⚠️ Test failures (non-blocking — review above)"

  bijaksana:
    if: github.actor != 'dependabot[bot]' && github.actor != 'app/dependabot'
    name: "Lane 2 — BIJAKSANA ΔS Φ Ψ Ω"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: "ΔS — Entropy (no adjudication)"
        run: |
          SELF_ADJUDICATE=$(grep -r "SEAL\|HOLD\|SABAR\|VOID" src/ --include="*.py" 2>/dev/null | grep -v "# \|test_\|__pycache__\|node_modules" | wc -l)
          echo "ΔS (self-adjudication patterns) = $SELF_ADJUDICATE"
          if [ "$SELF_ADJUDICATE" -gt 0 ]; then
            echo "⚠️ DOMAIN organs must not adjudicate — found $SELF_ADJUDICATE patterns"
          fi
      - name: "Φ — Clarity (epistemic labels)"
        run: |
          LABELS=$(grep -r "OBS\|DER\|INT\|SPEC" src/ --include="*.py" 2>/dev/null | wc -l)
          echo "Φ (epistemic labels) = $LABELS"
      - name: "Ψ — Truth (tool surface)"
        run: |
          TOOLS=$(grep -r "def capital_\|def wealth_" src/ --include="*.py" 2>/dev/null | wc -l)
          echo "Ψ (WEALTH tools) = $TOOLS"
      - name: "Ω — Governance (cross-organ calls)"
        run: |
          CROSS=$(grep -r "geox_\|arif_judge\|arif_seal" src/ --include="*.py" 2>/dev/null | grep -v "mcp_bridge\|route\|proxy\|test_\|# \|__pycache__" | wc -l)
          echo "Ω (cross-organ calls) = $CROSS"
          if [ "$CROSS" -gt 0 ]; then
            echo "⚠️ DOMAIN organs should not call other organs directly"
          fi

  report:
    if: (always()) && (github.actor != 'dependabot[bot]' && github.actor != 
      'app/dependabot')
    name: "📊 Agentic CI Report"
    runs-on: ubuntu-latest
    needs: [standard, bijaksana]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Generate Report
        run: |
          echo "WEALTH CI: standard=${{ needs.standard.result }} | bijaksana=${{ needs.bijaksana.result }}"
          echo "Federated CI report generated for WEALTH (L3 DOMAIN)"
