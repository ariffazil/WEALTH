# ════════════════════════════════════════════════════════════════════
# 1. THE 3 ENFORCEMENT BANDS (the doctrine)
# ════════════════════════════════════════════════════════════════════

enforcement_bands:
  - id: band-1-sdk
    name: "Inside Runtime (SDK)"
    surface: in-process hook
    mechanism: "arifos_kernel_sdk.py / arifos-kernel-sdk npm"
    latency: "low (ms)"
    context: "rich (full envelope available)"
    coverage: "agents we control"
    agents: [opencode, kimi-code, openclaw, hermes-asi, claude-code, continue-cli, copilot]
    cost: "minimal (local in-process check)"

  - id: band-2-mcp
    name: "Transport (MCP Gateway)"
    surface: MCP server
    mechanism: "arifOS MCP at port 8088 (MVTS-pruned)"
    latency: "medium (10-50ms)"
    context: "tool-call-only (no cognitive visibility)"
    coverage: "MCP-speaking clients (any)"
    agents: [claude-desktop, cursor, third-party MCP, future IDEs]
    cost: "schema loading + judge deliberation per call"

  - id: band-3-os
    name: "OS-Level (EDR Sidecar)"
    surface: syscall intercept
    mechanism: "eBPF / KubeArmor / ClawEDR-style sidecar"
    latency: "lowest (kernel)"
    context: "process tree + syscalls"
    coverage: "anything that escapes band-1 and band-2"
    agents: [openclaw when untrusted, third-party runtimes, future hostile]
    cost: "operational complexity; last resort"

band_priority: [band-1-sdk, band-2-mcp, band-3-os]
band_fallback: "if band-1 unavailable, fall back to band-2; if band-2 unavailable, escalate to band-3 or HOLD"

