# 3. WIRING RULES (the doctrine)
# ════════════════════════════════════════════════════════════════════

wiring_rules:
  - id: WR-001
    rule: "All HEXAGON agents (333-AGI, 555-ASI, 888-APEX) MUST use band-1-sdk."
    reason: "Constitutional agents need full envelope visibility."
  - id: WR-002
    rule: "All agents in the Coding Federation (opencode, claude-code, etc.) MUST load the SDK before any tool call."
    reason: "Coding federation has high-blast-radius tools; SDK is the cheapest enforcement."
  - id: WR-003
    rule: "Runtime agents with Telegram presence (hermes-asi, openclaw) MUST use band-1-sdk + band-3-os."
    reason: "External surface; OS-band catches anything SDK misses."
  - id: WR-004
    rule: "Role agents (kernel-scribe, ops-planner, etc.) MUST NOT exceed their lease_max."
    reason: "Role agents are bounded; lease ceiling is the line."
  - id: WR-005
    rule: "Any agent without SDK falls back to band-2-mcp; if MCP is also unavailable, escalation is 888_HOLD."
    reason: "Capability is not permission. Unbound agent has no authority."
  - id: WR-006
    rule: "Reality Contracts are loaded per agent at session_init; relevant organs only."
    reason: "WEALTH contract loaded for agents touching WEALTH; GEOX for agents touching GEOX; etc."
  - id: WR-007
    rule: "Cross-organ calls MUST go through arifOS MCP (port 8088); direct organ-to-organ is denied."
    reason: "Federation call graph: 0 direct inter-organ edges. arifOS is the audit plane."

# ════════════════════════════════════════════════════════════════════
# 4. ENFORCEMENT VERIFICATION
# ════════════════════════════════════════════════════════════════════

verification:
  - check: "agent.session_id is bound at boot"
    method: "arif_session_init"
    fail_action: "BLOCK until bound"
  - check: "agent.sdk is loaded"
    method: "import arifos_kernel_sdk"
    fail_action: "fall back to band-2-mcp"
  - check: "agent.lease_max is respected"
    method: "arif_lease_inspect"
    fail_action: "BLOCK + 888_HOLD"
  - check: "agent.reality_contracts is loaded (if touching organs)"
    method: "load yaml at session_init"
    fail_action: "HOLD (no offline check)"
  - check: "agent.band includes at least one of band-1, band-2, band-3"
    method: "static analysis of wire_contract"
    fail_action: "DENY deployment"

