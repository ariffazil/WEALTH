[project]
name = "wealth-valuation-kernel"
version = "2026.07.24"
description = "WEALTH Sovereign Valuation Kernel — Universal Resource Allocation Intelligence (URAI) with constitutional governance for arifOS"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0"
authors = [
    {name = "Arif Fazil", email = "arif@arif-fazil.com"}
]
keywords = ["finance", "valuation", "mcp", "arifOS", "constitutional-ai", "wealth"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
]

dependencies = [
    "supabase>=2.10.0",
    "fastmcp[tasks]==3.4.4",
    "anyio>=4.13.0",
    "numpy>=2.4.6",
    "scipy>=1.17.1",
    "numpy-financial>=1.0.0",
    "asyncpg>=0.31.0",
    "pydantic>=2.13.4",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.1.0",
    "starlette>=0.40.0",
    "uvicorn[standard]>=0.49.0",
    "fastapi>=0.136.1",
    "yfinance>=0.2.0",
    # klse_screener is a custom package (not on PyPI) — installed system-wide in /usr/local/lib/python3.13/dist-packages
    # WEALTH's internal bursa/klse_adapter.py imports it as a system package; kept out of pyproject.toml to avoid resolution failure.
    "pydantic-ai>=0.0.14",
    "langgraph>=0.2.0",
    "opa-python-client>=0.3.0",
    "sigstore>=2.0.0",
    "openlineage-python>=1.0.0",
    "duckdb>=0.10.0",
    "polars>=1.0.0",
    "pandera>=0.19.0",
    "pyportfolioopt>=1.5.5",
    "networkx>=3.3",
    "pyarrow>=17.0.0",
    "opentelemetry-api>=1.42.1",
    "opentelemetry-sdk>=1.42.1",
    "quantlib>=1.42.1",
    "riskfolio-lib>=7.3.0",
    "pymc>=6.0.1",
    "arviz>=1.2.0",
    "mesa>=3.5.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.18",
]

[tool.setuptools.packages.find]
include = ["wealth_*"]
exclude = ["wealth_valuation_kernel.egg-info"]
