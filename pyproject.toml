[project]
name = "wealth-valuation-kernel"
version = "2026.06.02"
description = "WEALTH Sovereign Valuation Kernel — Universal Resource Allocation Intelligence (URAI) with constitutional governance for arifOS"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0"
authors = [
    {name = "Arif Fazil", email = "arif@arif-fazil.com"}
]
keywords = ["finance", "valuation", "mcp", "arifOS", "constitutional-ai", "wealth"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 (AGPL-3.0)",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
]

dependencies = [
    "supabase>=2.10.0",
    "fastmcp[tasks]>=3.3.1,<4",
    "anyio>=4.0.0",
    "numpy>=1.26.0",
    "scipy>=1.10.0",
    "numpy-financial>=1.0.0",
    "asyncpg>=0.29.0",
    "pydantic>=2.0.0",
    "httpx>=0.25.0",
    "psycopg[binary]>=3.1.0",
    "starlette>=0.40.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
