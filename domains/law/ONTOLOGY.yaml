# ---------------------------------------------------------------------------
# PROPOSED TOOLS — 13 atomic law verbs (merged from 015 series)
# ---------------------------------------------------------------------------
proposed_tools:
  - name: wealth_law_lookup_act
    description: "Fetch Act metadata + section list by citation"
    capacity_band: OBSERVE
    input: { citation: "string", section: "string?" }
    output: { act_metadata: "object", sections: "list<object>" }
    witness_required: false
    888_hold: never

  - name: wealth_law_lookup_section
    description: "Fetch specific section text + interpretation notes"
    capacity_band: OBSERVE
    input: { citation: "string", section_id: "string" }
    output: { section_text: "string", truth_band: "enum", notes: "string" }
    witness_required: false
    888_hold: never

  - name: wealth_law_classify_case
    description: "Classify pusaka case (kecil/besar, Muslim/non-Muslim)"
    capacity_band: OBSERVE
    input: { religion: "enum", estate_value_myr: "float", has_will: "bool" }
    output: { case_category: "enum", jurisdiction: "enum", routing: "string" }
    witness_required: false
    888_hold: "when religion unknown or value at boundary (2M)"

  - name: wealth_law_route_institution
    description: "Recommend institution given case context"
    capacity_band: OBSERVE
    input: { case_type: "enum", state: "string", religion: "enum" }
    output: { institution: "object", routing_path: "string", appeal_path: "list<string>" }
    witness_required: false
    888_hold: "when religion boundary"

  - name: wealth_law_flag_risk
    description: "Detect legal risk surfaces in proposed action"
    capacity_band: OBSERVE
    input: { proposed_action: "string", context: "object" }
    output: { risk_markers: "list<object>", triggers: "list<string>", recommendation: "enum" }
    witness_required: true
    888_hold: "always (high-stakes advisory)"

  - name: wealth_law_generate_checklist
    description: "Generate human-facing checklist (docs, steps, forms)"
    capacity_band: DRAFT
    input: { case_type: "enum", state: "string" }
    output: { checklist: "list<object>", forms_required: "list<string>", timeline: "object" }
    witness_required: false
    888_hold: never

  - name: wealth_law_draft_form
    description: "Draft filled form template (Borang A, 14A, etc.) with DRAFT watermark"
    capacity_band: DRAFT
    input: { form_id: "string", case_data: "object" }
    output: { form_pdf_path: "string", watermark: "string", disclaimer: "string" }
    witness_required: true
    888_hold: "before output (watermark mandatory)"

  - name: wealth_law_parse_document
    description: "OCR + extract fields from Geran, Sijil Kematian, etc."
    capacity_band: OBSERVE
    input: { document_path: "string", document_type: "enum" }
    output: { extracted_fields: "object", confidence: "float", pdpa_consent_required: "bool" }
    witness_required: false
    888_hold: "when PDPA data involved"

  - name: wealth_law_faraid_calculate
    description: "Compute Faraid shares (asal-usul → fard → furudh → hajb → asabah → ausan → radd)"
    capacity_band: OBSERVE
    input: { heirs: "list<object>", estate: "object" }
    output: { shares: "list<object>", rule_citations: "list<string>", edge_cases: "list<string>" }
    witness_required: true
    888_hold: "always — counsel review mandatory"

  - name: wealth_law_distribution_calculate
    description: "Compute Distribution Act 1958 shares for non-Muslim"
    capacity_band: OBSERVE
    input: { heirs: "list<object>", estate: "object" }
    output: { shares: "list<object>", statute_citations: "list<string>" }
    witness_required: true
    888_hold: "always — counsel review recommended"

  - name: wealth_law_jurisdiction_resolve
    description: "Resolve which jurisdiction applies (Federal/State/Syariah/Civil/Adat)"
    capacity_band: OBSERVE
    input: { facts: "object", religion: "enum", asset_state: "string" }
    output: { jurisdiction: "enum", deciding_authority: "string", conflicts: "list<string>" }
    witness_required: true
    888_hold: "when conflict detected or boundary case"

  - name: wealth_law_drift_detect
    description: "Watch for amendment/version drift in loaded pack"
    capacity_band: OBSERVE
    input: { pack_id: "string" }
    output: { current_hash: "string", latest_hash: "string", drift_detected: "bool" }
    witness_required: false
    888_hold: never

  - name: wealth_law_human_ack
    description: "Surface legal HOLD to human for explicit acknowledgement"
    capacity_band: NEVER_BIND
    input: { trigger: "object", context: "object" }
    output: { ack_received: "bool", ack_signature: "string" }
    witness_required: true
    888_hold: "always — hard human gate"

# ---------------------------------------------------------------------------
# LAW LAYERS — soul / shadow / anthropology schema
# ---------------------------------------------------------------------------
law_layers:
  description: |
    Every legal event in WEALTH is read through three layers.
    The soul layer is sealed canon. The shadow layer is institutional reality.
    The anthropology layer is the living human who must translate between
    incompatible grammars (adat, Syariah, state) while pretending they are one.
  layers:
    - id: sealed_canon
      name: "Soul of Law"
      note: "Rules exist, persist, bind even the ruler."
      primitives: [Act, Section, Jurisdiction]
      witness: arifOS
      examples:
        - "Kanun Tanah Negara 1965, Section 5"
        - "Federal Constitution Article 153"
        - "Faraid Quranic shares"

    - id: institutional_shadow
      name: "Shadow of the Human Behind It"
      note: "Law is scar tissue crystallised into text."
      primitives: [Institution, institutional_graph, hold_matrix]
      witness: WEALTH
      examples:
        - "PTG Penang counters take N weeks; Borang 14A needs X"
        - "Mahkamah Tinggi probate backlog"
        - "Amanah Raya fee structure"

    - id: living_human_gap
      name: "Anthropology / Living Human Gap"
      note: "The Mak cik who doesn't know Form A."
      primitives: [AnthropologyRecord, HumanNarrative]
      witness: WELL
      examples:
        - "Adat says tanah pusaka cannot jual; KTN says boleh with consent"
        - "Faraid fixed shares vs family agreement (ta'wil)"
        - "No one told the widow about Small Estates Act"

  record_types:
    AnthropologyRecord:
      type: object
      required: [layer, subject, narrative, dignity_risk, source_acts, witness]
      properties:
        layer:
          type: string
          enum: [sealed_canon, institutional_shadow, living_human_gap]
        subject:
          type: string
          description: "One-line human subject, e.g. 'Mak cik, heir to kampung lot'"
        narrative:
          type: string
          description: "Plain-language gap story. No legal verdict."
        dignity_risk:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL]
        source_acts:
          type: array
          items: { type: string }
        missing_tests:
          type: array
          items: { type: string }
        flags:
          type: array
          items: { type: string }
        witness:
          type: string
          enum: [WELL, arifOS, WEALTH, human]

    HumanNarrative:
      type: object
      required: [who, what_they_know, what_they_need, translation_gap]
      properties:
        who: { type: string }
        what_they_know: { type: string }
        what_they_need: { type: string }
        translation_gap: { type: string }
        grammar_clash:
          type: array
          items:
            type: string
            enum: [adat, syariah, state, ncr]

