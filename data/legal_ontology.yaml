# 888_HOLD MATRIX — asymmetric gates for law domain
# -----------------------------------------------------------------------------
hold_888_matrix:
  - pattern_id: "RELIGION_BOUNDARY"
    description: "Religion unknown or boundary case"
    trigger:
      field: "deceased.religion"
      condition: "in [UNKNOWN, AMBIGUOUS]"
    weight: 9
    action: "ASK_888 — do not guess religion; misrouting is harm"
    maruah_floor: true

  - pattern_id: "MINOR_HEIR"
    description: "Minor heir present"
    trigger:
      field: "heir.is_minor"
      condition: "== true"
    weight: 9
    action: "ASK_888 — minor's share requires guardian + court oversight"
    maruah_floor: true

  - pattern_id: "DISPUTED"
    description: "Case is disputed"
    trigger:
      field: "case.is_disputed"
      condition: "== true"
    weight: 10
    action: "ESCALATE_TO_PEGUAM"
    maruah_floor: true

  - pattern_id: "COURT_FILING"
    description: "Step 5-7 (file/hearing/grant)"
    trigger:
      field: "process.current_step"
      condition: "in [STEP_5_FILE, STEP_6_HEARING, STEP_7_GRANT]"
    weight: 10
    action: "REDIRECT_TO_PEGUAM"

  - pattern_id: "LAND_TRANSFER"
    description: "Step 8 — land transfer"
    trigger:
      field: "process.current_step"
      condition: "== STEP_8_TRANSFER"
    weight: 9
    action: "VERIFY_WITH_PTG"

  - pattern_id: "FARAID_RESULT"
    description: "After faraid calculation"
    trigger:
      field: "tool.last_invocation"
      condition: "== arif_faraid_calculate"
    weight: 9
    action: "REVIEW_WITH_SYARIAH_COUNSEL"
    maruah_floor: true

  - pattern_id: "DISTRIBUTION_RESULT"
    description: "After distribution calculation"
    trigger:
      field: "tool.last_invocation"
      condition: "== arif_distribution_calculate"
    weight: 8
    action: "REVIEW_WITH_COUNSEL"

  - pattern_id: "HIGH_VALUE"
    description: "Estate > RM 2M"
    trigger:
      field: "case.estimated_gross_estate_value_myr"
      condition: "> 2_000_000"
    weight: 8
    action: "PEGUAM_REQUIRED"

  - pattern_id: "WASIAT_INTERPRETATION"
    description: "Will contested"
    trigger:
      field: "case.has_will AND case.is_disputed"
      condition: "== true"
    weight: 10
    action: "ESCALATE — hakim"

  - pattern_id: "CROSS_BORDER"
    description: "Cross-border asset"
    trigger:
      field: "asset.jurisdiction"
      condition: "!= MY"
    weight: 9
    action: "ASK_888 — different law applies"

  - pattern_id: "PDPA_HEIR_DATA"
    description: "Heir personal data stored"
    trigger:
      field: "consent.obtained"
      condition: "== false"
    weight: 8
    action: "ASK_888 — PDPA explicit consent required"

  - pattern_id: "NCR_HERITAGE"
    description: "Sabah/Sarawak NCR or heritage property"
    trigger:
      field: "asset.location_state"
      condition: "in [SABAH, SARAWAK]"
    weight: 10
    action: "ESCALATE — heritage/NCR law"
    maruah_floor: true

