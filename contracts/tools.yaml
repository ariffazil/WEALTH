# WEALTH Public MCP Tool Registry — LIVE SOT (ZEN 2026-07-15)
# ─────────────────────────────────────────────────────────────
# Public tools/list count: 12 (mode-dispatched)
# Canonical runtime: wealth_mcp/server.py ← server_federated.py
# LEGACY monolith catalog: contracts/archive/tools.yaml.monolith-legacy-2026-05-19
# Capability map (modes): docs/TOOL_MODE_MAP.md
# Truth rule: authenticated tools/list beats this file if they disagree.
#
# Do NOT count modes as separate tools. Do NOT claim "50 public tools."
#
# Public discovery routes (advertised by public/sitemap.xml):
#   See contracts/mcp_surface.yaml::public_discovery_routes for the canonical list.
#   The terminal/commodity routes are rendered by site/build.py and live under
#   site/dist/{gold,oil,gas,wealth}/index.html. They MUST keep parity with
#   public/sitemap.xml (verified by tests/test_public_discovery.py).

schema_version: "2026.07.15"
organ: WEALTH
domain_law: CAPITAL_LAW
authority: compute_only_advisory
mcp_transport: streamable-http
mcp_endpoint: http://127.0.0.1:18082/mcp
health_endpoint: http://127.0.0.1:18082/health
public_tool_count: 12
entry: server_federated.py
license: AGPL-3.0

tools:
  capital_primitive:
    kind: deductive
    modes: [npv, irr, emv, evoi, mc, kelly, markowitz, robust, chance_constrained, two_stage]
  capital_health:
    kind: deductive
    modes: [conservation, flow, runway, survival, fiscal_breakeven, confluence, asymmetry]
  capital_diagnose:
    kind: abductive
    modes: [stress_index, governance_capacity, cascade_model, exploitation_detect, collapse_signature, beautiful_mouse, capture_scan, power_audit, bid_surface, optimize_mwc, cadence_monitor, crisis_reflex]
  capital_wisdom:
    kind: abductive
    modes: [wisdom, omni, epistemic]
  capital_market:
    kind: observational
    modes: [fx, commodity, indicator, stock]
  capital_ledger:
    kind: ledger
    modes: [query, write]
    action_class: IRREVERSIBLE
    risk_class: C2
    query_override: READONLY
  capital_registry:
    kind: meta
    modes: [status, schema, domains, health]
  capital_entropy:
    kind: abductive
    modes: [power_consequence_map, metric_purpose_audit, responsibility_ledger, trust_capital_decay, coercive_order_cost, entropy_externality]
  wealth_institutional_stress_index:
    kind: institutional
    modes: []
  wealth_cascade_model:
    kind: institutional
    modes: []
  wealth_governance_capacity:
    kind: institutional
    modes: []
  wealth_external_exploitation_detect:
    kind: institutional
    modes: []

# Terminal + commodity routes are not MCP tools — they are public HTTP routes.
# They live here so that tests and CI can verify sitemap/dist parity.
public_routes:
  organ:
    - {path: "/",                  lastmod: "2026-07-24"}
    - {path: "/llms.txt",          lastmod: "2026-07-24"}
    - {path: "/.well-known/agent.json", lastmod: "2026-07-25"}
    - {path: "/.well-known/mcp.json",   lastmod: "2026-07-24"}
    - {path: "/health",            lastmod: "2026-07-24"}
    - {path: "/mcp",               lastmod: "2026-07-24"}
    - {path: "/data/wealth/latest.json",          lastmod: "2026-07-24"}
    - {path: "/data/wealth/petronas_vitals.json", lastmod: "2026-07-24"}
  terminal:
    - {path: "/wealth/",      lastmod: "2026-07-17", dist: "site/dist/wealth/index.html"}
    - {path: "/wealth/llms.txt", lastmod: "2026-07-17", dist: "site/dist/wealth/llms.txt"}
    - {path: "/wealth/gold/", lastmod: "2026-07-17", dist: "site/dist/gold/index.html"}
    - {path: "/wealth/oil/",  lastmod: "2026-07-17", dist: "site/dist/oil/index.html"}
    - {path: "/wealth/gas/",  lastmod: "2026-07-17", dist: "site/dist/gas/index.html"}
