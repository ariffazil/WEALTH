schema_version: 3
kind: arifos.mcp_surface
owner_repo: WEALTH
status: contract
last_verified: "2026-07-30"
implementation_status:
  phase: "Federated 14-tool mode-dispatched surface (loop 2 reconciled)"
runtime_surface:
  primary_transport: streamable_http
  primary_port: 18082
  public_domain: https://wealth.arif-fazil.com
  entrypoint: server_federated.py
  public_surface_count: 14
  canonical_capital_count: 9
  institutional_compatibility_count: 5
  hidden_alias_count: 0
  registry_truth: PASS
authority:
  owns:
    - capital_viability
    - risk_scoring
    - emv_npv_irr_dscr
    - portfolio_scenarios
    - decision_memos
    - ledger_operations
    - institutional_diagnostics
  resources_owned:
    - wealth://schema
    - wealth://tools/registry
    - wealth://prompts/index
    - wealth://domains/index
    - wealth://canon/*
    - wealth://glossary
    - wealth://federation/contract
    - wealth://health
    - wealth://reality/context
    - wealth://market/sources
    - wealth://risk/thresholds
    - wealth://affordance/contracts
    - wealth://handoff/arifos-schema
    - wealth://replay/receipt-schema
    - wealth://collapse/signatures
  excludes:
    - constitutional_judgment
    - geological_truth
    - deployment_substrate
    - final_capital_commitment
public_tools:
  canonical_capital:
    - capital_primitive
    - capital_health
    - capital_diagnose
    - capital_wisdom
    - capital_market
    - capital_ledger
    - capital_registry
    - capital_entropy
    - wealth_judge_handoff
  institutional_compatibility:
    - wealth_institutional_stress_index
    - wealth_cascade_model
    - wealth_governance_capacity
    - wealth_external_exploitation_detect
    - wealth_bid_surface
governance:
  capital_ledger:
    default_action_class: IRREVERSIBLE
    risk_class: C2
    query_override: READONLY
    write_requires:
      - arifOS_SEAL
      - ack_irreversible
  all_other_public_tools:
    execution_authority: compute_or_observe_only
artifact_policy:
  machine_readable: required
  human_readable: required_for_memos
  evidence_refs: required
  assumption_limits: required
public_discovery_routes:
  # Routes advertised by public/sitemap.xml and rendered by site/build.py.
  # Source of truth = site/dist/{...} — every route here MUST have a real file.
  # The makcikgpt DRAFT_ONLY persona is intentionally excluded.
  apex:
    - path: /
      source: organ home (llms.txt)
    - path: /llms.txt
      source: public/llms.txt
    - path: /.well-known/agent.json
      source: .well-known/agent.json (organ public agent card)
    - path: /.well-known/mcp.json
      source: .well-known/mcp.json (MCP registry manifest)
    - path: /health
      source: server_federated.py
    - path: /mcp
      source: server_federated.py (FastMCP streamable-http)
    - path: /data/wealth/latest.json
      source: federated data layer
    - path: /data/wealth/petronas_vitals.json
      source: wealth_core/petronas_vitals.py
  terminal:
    - path: /wealth/
      source: site/dist/wealth/index.html (terminal home)
    - path: /wealth/llms.txt
      source: site/dist/wealth/llms.txt
    - path: /wealth/gold/
      source: site/dist/gold/index.html (XAUUSD workspace)
    - path: /wealth/oil/
      source: site/dist/oil/index.html (Brent crude workspace)
    - path: /wealth/gas/
      source: site/dist/gas/index.html (Henry Hub workspace)
hold_conditions:
  - missing_financial_evidence
  - large_hedge_drag
  - irreversible_capital_action
  - geological_assumption_not_grounded_by_geox
